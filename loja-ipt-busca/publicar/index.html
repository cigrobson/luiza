<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Busca de Serviços IPT</title>
<meta name="description" content="Busca no catálogo de ensaios, análises e calibrações do IPT.">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#f4f6fa}
@media (prefers-color-scheme:dark){body{background:#0b1220}}
#busca-ipt{--fonte:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
</style>
<style>
/* Busca de Serviços IPT: todo o estilo fica restrito a #busca-ipt. Para a identidade visual, altere só as variáveis. */
#busca-ipt{
  --fonte:inherit;        /* fonte do tema; troque se quiser outra */
  --topo-fixo:12px;       /* altura do cabeçalho fixo do tema + folga */
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#eef2f8; --line:#dde3ee;
  --text:#14213d; --muted:#5a6680; --primary:#002458; --primary-ink:#ffffff;
  --accent:#01adef; --accent-soft:#e3f6fe; --mark:#fff1b8; --ok:#0f7b4f; --ok-soft:#e2f5ec;
  --shadow:0 1px 2px rgba(16,32,64,.06),0 4px 16px rgba(16,32,64,.06);
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
#busca-ipt:not([data-theme="light"]){
    --bg:#0b1220; --surface:#131c2e; --surface-2:#1a2540; --line:#26324d;
    --text:#e7ecf6; --muted:#9aa7c2; --primary:#5cc8f5; --primary-ink:#06192f;
    --accent:#5cc8f5; --accent-soft:#12324a; --mark:#5a4a0f; --ok:#5fd3a0; --ok-soft:#12352a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
#busca-ipt[data-theme="dark"]{
  --bg:#0b1220; --surface:#131c2e; --surface-2:#1a2540; --line:#26324d;
  --text:#e7ecf6; --muted:#9aa7c2; --primary:#5cc8f5; --primary-ink:#06192f;
  --accent:#5cc8f5; --accent-soft:#12324a; --mark:#5a4a0f; --ok:#5fd3a0; --ok-soft:#12352a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
/* Blindagem contra estilos do tema.
   :where() mantém a especificidade em (1,0,0): vence seletores de elemento e de classe do tema
   e perde para as regras da própria busca (#busca-ipt .bi-*), que vêm com (1,1,0). */
#busca-ipt :where(div,section,aside,article,form,details,summary,span,p,h1,h2,h3,dl,dt,dd,mark,label,dialog,button,input,select,a,svg){float:none;transform:none;columns:auto;text-shadow:none;letter-spacing:normal;text-transform:none;min-width:0}
#busca-ipt :where(h1,h2,h3,p,dl,dd,figure){margin:0;padding:0}
#busca-ipt :where(button){margin:0;padding:0;border:0;border-radius:0;background:none;box-shadow:none;width:auto;max-width:none;height:auto;min-height:0;display:inline-block;font:inherit;color:inherit;line-height:inherit;text-decoration:none;cursor:pointer}
#busca-ipt :where(input,select){margin:0;width:auto;max-width:100%;height:auto;min-height:0;box-shadow:none;font:inherit;color:inherit}
#busca-ipt :where(input[type=checkbox]){padding:0;border:initial;width:auto;height:auto;appearance:auto;-webkit-appearance:checkbox}
#busca-ipt :where(label){display:inline;margin:0;padding:0;font-weight:inherit}
#busca-ipt :where(a){text-decoration:none;box-shadow:none;border:0}
#busca-ipt :where(dialog){max-width:none;min-width:0;margin:auto;inset:0;position:fixed}
#busca-ipt :where(img,svg){max-width:100%}
#busca-ipt .bi-fonte{color:var(--muted);font-size:13px;padding:18px 0 8px;border-top:1px solid var(--line);margin-top:8px}
#busca-ipt,#busca-ipt *,#busca-ipt *::before,#busca-ipt *::after{box-sizing:border-box}
#busca-ipt{container:busca / inline-size;margin:0;background:var(--bg);color:var(--text);
  font-size:15px;line-height:1.55;font-family:var(--fonte)}
#busca-ipt a{color:inherit}
#busca-ipt button,#busca-ipt input,#busca-ipt select{font:inherit;color:inherit}
#busca-ipt .bi-wrap{max-width:1240px;margin:0 auto;padding:0 16px}
#busca-ipt .bi-hero{padding:28px 0 18px}
#busca-ipt .bi-hero .bi-titulo{margin:0 0 4px;font-size:clamp(22px,3.2vw,30px);line-height:1.2}
#busca-ipt .bi-hero p{margin:0 0 18px;color:var(--muted)}
#busca-ipt .bi-searchbox{position:relative}
#busca-ipt .bi-searchbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
#busca-ipt .bi-searchbox input{width:100%;height:56px;border-radius:var(--radius);border:1.5px solid var(--line);
  background:var(--surface);padding:0 48px 0 48px;font-size:17px;box-shadow:var(--shadow);outline:none}
#busca-ipt .bi-searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
#busca-ipt input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
#busca-ipt .bi-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;
  width:36px;height:36px;border-radius:50%;cursor:pointer;color:var(--muted);display:none}
#busca-ipt .bi-clear:hover{background:var(--surface-2)}
#busca-ipt .bi-examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center;font-size:13px;color:var(--muted)}
#busca-ipt .bi-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
#busca-ipt .bi-chip:hover{border-color:var(--accent)}
#busca-ipt .bi-layout{display:grid;grid-template-columns:260px 1fr;gap:24px;padding-bottom:48px}
@container busca (max-width:860px){
#busca-ipt .bi-layout{grid-template-columns:1fr}
}
#busca-ipt aside .bi-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 10px;position:sticky;top:var(--topo-fixo,12px)}
#busca-ipt aside details>summary{list-style:none;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;align-items:center}
#busca-ipt aside details>summary::-webkit-details-marker{display:none}
#busca-ipt aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 0 8px}
#busca-ipt .bi-opt{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-radius:8px;cursor:pointer;font-size:14px}
#busca-ipt .bi-opt:hover{background:var(--surface-2)}
#busca-ipt .bi-opt input{margin-top:3px;accent-color:var(--accent)}
#busca-ipt .bi-opt .bi-n{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#busca-ipt .bi-opt .bi-lbl{min-width:0}
#busca-ipt .bi-opt .bi-lbl small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
#busca-ipt .bi-opt.bi-zero{opacity:.45}
#busca-ipt .bi-linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:6px 0;font-size:13px}
#busca-ipt .bi-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
#busca-ipt .bi-count{font-size:14px;color:var(--muted)}
#busca-ipt .bi-count strong{color:var(--text)}
#busca-ipt .bi-bar select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px}
#busca-ipt .bi-notice{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:14px}
#busca-ipt .bi-notice button{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;font-weight:600}
#busca-ipt .bi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
@container busca (max-width:400px){
#busca-ipt .bi-grid{grid-template-columns:1fr}
}
#busca-ipt .bi-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-width:0}
#busca-ipt .bi-card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
#busca-ipt .bi-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#busca-ipt .bi-code{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface-2);border-radius:6px;padding:5px 7px;color:var(--muted)}
#busca-ipt .bi-badge{font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--ok-soft);color:var(--ok)}
#busca-ipt .bi-badge.bi-type{background:var(--surface-2);color:var(--muted);font-weight:500}
#busca-ipt .bi-card h2{font-size:16.5px;line-height:1.35;margin:0;overflow-wrap:anywhere}
#busca-ipt .bi-lab{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
#busca-ipt .bi-sigla{flex:none;font-weight:700;color:var(--primary);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
#busca-ipt .bi-desc{margin:0;font-size:14px;color:var(--text);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
#busca-ipt .bi-desc.bi-none{color:var(--muted);font-style:italic}
#busca-ipt .bi-kw{display:flex;flex-wrap:wrap;gap:6px}
#busca-ipt .bi-kw span{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:2px 8px}
#busca-ipt .bi-actions{display:flex;gap:8px;margin-top:auto;padding-top:4px}
#busca-ipt .bi-btn{flex:1;display:inline-flex;justify-content:center;align-items:center;gap:6px;height:40px;border-radius:10px;
  font-weight:600;font-size:14px;text-decoration:none;cursor:pointer;border:1.5px solid transparent;white-space:nowrap}
#busca-ipt .bi-btn.bi-sec{background:transparent;border-color:var(--line);color:var(--text)}
#busca-ipt .bi-btn.bi-sec:hover{border-color:var(--accent)}
#busca-ipt .bi-btn.bi-pri{background:var(--primary);color:var(--primary-ink)}
#busca-ipt .bi-btn.bi-pri:hover{filter:brightness(1.12)}
#busca-ipt mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
#busca-ipt .bi-more{display:flex;justify-content:center;margin-top:20px}
#busca-ipt .bi-more .bi-btn{flex:none;padding:0 22px}
#busca-ipt .bi-empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--muted)}
#busca-ipt .bi-empty h2{color:var(--text);font-size:18px;margin:0 0 6px}
#busca-ipt dialog{border:0;padding:0;border-radius:18px;width:min(760px,calc(100vw - 24px));max-height:calc(100dvh - 24px);
  background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}
#busca-ipt dialog::backdrop{background:rgba(8,16,32,.55)}
#busca-ipt .bi-dlg-head{position:sticky;top:0;background:var(--surface);padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
#busca-ipt .bi-dlg-head h2{margin:6px 0 0;font-size:20px;line-height:1.3}
#busca-ipt .bi-x{margin-left:auto;flex:none;border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px}
#busca-ipt .bi-dlg-body{padding:16px 20px 8px}
#busca-ipt .bi-dlg-body dl{display:grid;grid-template-columns:150px 1fr;gap:10px 16px;margin:0}
@media (max-width:560px){
#busca-ipt .bi-dlg-body dl{grid-template-columns:1fr;gap:2px}
#busca-ipt .bi-dlg-body dd{margin-bottom:10px}
}
#busca-ipt .bi-dlg-body dt{color:var(--muted);font-size:13px}
#busca-ipt .bi-dlg-body dd{margin:0;overflow-wrap:anywhere}
#busca-ipt .bi-dlg-body dd a{color:var(--accent);text-decoration:underline}
#busca-ipt .bi-dlg-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap}
#busca-ipt .bi-dlg-foot .bi-btn{flex:1 1 180px}
#busca-ipt .bi-norms{display:flex;flex-wrap:wrap;gap:6px}
#busca-ipt .bi-norms span{font:600 12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface-2);border-radius:6px;padding:2px 8px}
#busca-ipt .bi-hint{font-size:12px;color:var(--muted)}
#busca-ipt .bi-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#busca-ipt .bi-badge.bi-compra{background:var(--accent-soft);color:var(--primary)}
#busca-ipt .bi-badge.bi-solic{background:var(--surface-2);color:var(--muted);font-weight:600}
#busca-ipt .bi-preco{margin:0;font-weight:700;font-size:16px;color:var(--text)}
#busca-ipt [hidden]{display:none!important}
</style>
</head>
<body>
<div id="busca-ipt" class="busca-ipt" data-dados="busca-servicos.json">
<div class="bi-wrap">
<section class="bi-hero">
    <h1 class="bi-titulo">Ensaios, análises e calibrações</h1>
    <p id="bi-sub">Pesquise no catálogo de serviços dos laboratórios do IPT.</p>
    <form class="bi-searchbox" role="search" onsubmit="return false">
      <label class="bi-sr" for="bi-q">Buscar serviço</label>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="bi-q" type="search" autocomplete="off" spellcheck="false" maxlength="200"
        placeholder="Ensaio, material, norma ou laboratório. Ex.: dureza, NBR 7190, etanol">
      <button class="bi-clear" id="bi-clear" type="button" aria-label="Limpar busca">✕</button>
    </form>
    <div class="bi-examples" id="bi-examples"><span>Experimente:</span></div>
  </section>

  <div class="bi-layout">
    <aside>
      <div class="bi-panel">
        <details id="bi-filters" open>
          <summary>Filtros <span class="bi-hint" id="bi-factive"></span></summary>
          <h3>Acreditação</h3>
          <label class="bi-opt"><input type="checkbox" id="bi-fcgcre"><span class="bi-lbl">Somente com certificado Cgcre</span><span class="bi-n" id="bi-ncgcre"></span></label>
          <div id="bi-gmod">
          <h3>Modalidade</h3>
          <div id="bi-fmod"></div>
          </div>
          <h3>Tipo de serviço</h3>
          <div id="bi-ftipo"></div>
          <h3>Laboratório</h3>
          <div id="bi-flab"></div>
          <button class="bi-linkbtn" id="bi-freset" type="button">Limpar filtros</button>
        </details>
      </div>
    </aside>

    <section aria-labelledby="bi-count">
      <div class="bi-bar">
        <div class="bi-count" id="bi-count" aria-live="polite"></div>
        <label>
          <span class="bi-sr">Ordenar</span>
          <select id="bi-sort">
            <option value="rel">Mais relevantes</option>
            <option value="nome">Nome (A–Z)</option>
            <option value="cod">Código</option>
          </select>
        </label>
      </div>
      <div id="bi-notices"></div>
      <div class="bi-grid" id="bi-grid"></div>
      <div class="bi-more" id="bi-more"></div>
    </section>
  </div>
<p class="bi-fonte" id="bi-foot"></p>
</div>
<dialog id="bi-dlg" aria-labelledby="bi-dlg-title"></dialog>
</div>

<script>
/* Busca de Serviços IPT
   Catálogo de ensaios, análises e calibrações (origem: Scriba/Busca_EAC).
   A marcação vive em #busca-ipt. Catálogo técnico: window.BUSCA_IPT_DADOS (embutido) ou o JSON
   indicado em data-dados. Produtos da loja (opcional): <script type="application/json" id="bi-produtos">
   gerado pelo plugin WordPress, ou window.BUSCA_IPT_PRODUTOS. */
(function(){
"use strict";
const RAIZ = document.getElementById('busca-ipt');
if(!RAIZ) return;
function lerProdutos(){
  const el = document.getElementById('bi-produtos');
  if(el){ try{ const v = JSON.parse(el.textContent||'[]'); if(Array.isArray(v)) return v; }catch(e){ console.warn('Busca IPT: produtos inválidos', e); } }
  return Array.isArray(window.BUSCA_IPT_PRODUTOS) ? window.BUSCA_IPT_PRODUTOS : [];
}
const PRODUTOS = lerProdutos();
function iniciar(DADOS, semCatalogo){

/* ---------- texto: normalização e caixa ---------- */
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const STOP = new Set('a o as os e de da do das dos em no na nos nas para por com sem ao aos um uma ou se que sob ate pelo pela pelos pelas sua seu suas seus via entre conforme'.split(' '));
const SIGLAS = new Set(('ABNT NBR ISO ASTM IEC NM EN BS IPT CGCRE AGA UV AC DC CIE DIN IESNA LM CRL RBLE RBC CCA IRC TCC PCS DSC CCB CAL RTAC RTQ RTQAC HPLC TAPPI LED CISPR PTS PCI API RF MRPM NEA DN CUV TF FTIR FTP CMAR TRRF BSI PA CD IP EFT AM RLC TGA NT DMA JIS EAC CST RMN ANSI CEN NR TAG IA AWPA OM ICMS PFI PTB ND EMC INMETRO ABPM ANP ASME UL SAE OIML IPX IK TÜV NFPA UNE NEMA EPA OCDE OECD CONAMA ANVISA MAPA PBE ENCE IEEE GLP GNV BTU NOX SOX AEAC AEHC TOC COT ABCP LCPE LTDC LMM LME LV LQM LBE LGE LBI LCAP LCP LEL LMPC LPP LRM LSFEX LARI SIRGA NUTABES ASTMD').split(' '));
const UNID = {KV:'kV',MM:'mm',KG:'kg',CM:'cm',KN:'kN',GHZ:'GHz',HZ:'Hz',KHZ:'kHz',MHZ:'MHz',KPA:'kPa',MPA:'MPa',MG:'mg',MJ:'MJ',ML:'mL',PH:'pH',RPM:'rpm',KW:'kW',KWH:'kWh',MW:'MW',VA:'VA',KVA:'kVA',LUX:'lux'};
const PROPRIOS = new Set('janka rockwell brinell vickers shore breuning karl fischer cobb bekk klemm taber jokro pitot coriolis kjeldahl charpy izod los angeles abrams mullen schopper elmendorf gurley sheffield bendtsen martindale wyzenbeek venturi pfi'.split(' '));
function caso(s, titulo){
  if(!s) return '';
  let out = s.toLowerCase().replace(/[\p{L}\p{N}][\p{L}\p{N}\/\-]*/gu, w=>{
    const up = w.toUpperCase();
    if(SIGLAS.has(up) || /^[A-Z]+\d/i.test(up) && up.length<=12 && /\d/.test(up) && /[A-Z]/i.test(up) && !/^\d/.test(up)) return up;
    if(UNID[up]) return UNID[up];
    if(up.includes('/') && up.split('/').every(p=>SIGLAS.has(p))) return up;
    if(PROPRIOS.has(w) || (titulo && !STOP.has(w))) return w.charAt(0).toUpperCase()+w.slice(1);
    return w;
  });
  out = out.replace(/°c\b/g,'°C').replace(/°f\b/g,'°F').replace(/(\d)\s?ºc\b/g,'$1 ºC');
  if(!titulo) out = out.replace(/(^|[.!?:]\s+)(\p{Ll})/gu,(m,a,b)=>a+b.toUpperCase());
  return out;
}
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function marcar(texto, termos){
  const t = esc(texto);
  if(!termos.length) return t;
  return t.replace(/[\p{L}\p{N}]+/gu, w=>{
    const n = norm(w);
    return termos.some(v=> v.length>=2 && n.startsWith(v)) ? '<mark>'+w+'</mark>' : w;
  });
}
const tokens = s => norm(s).split(/[^a-z0-9]+/).filter(Boolean);

/* ---------- índice ---------- */
const TIPO_LOJA = 'Itens da Loja IPT';
const P = PRODUTOS.map(p=>{
  const cats = (p.categorias||[]).filter(Boolean), tags = (p.tags||[]).filter(Boolean);
  const o = {
    fonte:'loja', mod: p.compra ? 'compra' : 'solicitacao', registro:null, id:p.id,
    tipo_servico: TIPO_LOJA, nome:p.nome||'', descricao:p.descricao||'', palavras_chave:[...cats,...tags],
    laboratorios:[], certificados_cgcre:[], contato:{url:p.url}, url:p.url, preco:p.preco||'',
    carrinho:p.carrinho||'', compra:!!p.compra, sku:p.sku||'', categorias:cats,
    nomeV:p.nome||'', descV:p.descricao||'', kwV:cats, labsV:[], cgcre:false,
  };
  o.tNome = tokens(o.nome); o.tKw = tokens([...cats,...tags,o.sku].join(' ')); o.tDesc = tokens(o.descricao);
  o.tLab = tokens(cats.join(' ')); o.fNome = norm(o.nome); o.fAll = norm([o.nome,o.descricao,cats.join(' '),tags.join(' ')].join(' '));
  return o;
});
const SC = DADOS.servicos.map(s=>{
  const lab = s.laboratorios;
  const o = {
    ...s, fonte:'scriba', mod:'solicitacao',
    nomeV: caso(s.nome),
    descV: caso(s.descricao||''),
    kwV: s.palavras_chave.map(k=>caso(k)),
    labsV: lab.map(l=>({sigla:l.sigla, nome:caso(l.nome,true)})),
    cgcre: s.certificados_cgcre.length>0,
  };
  o.tNome = tokens(s.nome); o.tKw = tokens(s.palavras_chave.join(' ')); o.tDesc = tokens(s.descricao||'');
  o.tLab = tokens(lab.map(l=>l.sigla+' '+l.nome).join(' '));
  o.fNome = norm(s.nome); o.fAll = norm([s.nome,s.descricao,s.palavras_chave.join(' ')].join(' '));
  return o;
});
const S = [...P, ...SC];
const VOCAB = new Set(); S.forEach(s=>[s.tNome,s.tKw,s.tDesc,s.tLab].forEach(a=>a.forEach(t=>VOCAB.add(t))));
const VOCARR = [...VOCAB];
const USE = DADOS.use.map(u=>({termo:u.termo, use:u.use, n:norm(u.termo), nu:norm(u.use)}));
const LABS = (()=>{const m=new Map();S.forEach(s=>s.labsV.forEach(l=>{if(!m.has(l.sigla))m.set(l.sigla,l.nome)}));return [...m].sort((a,b)=>a[0].localeCompare(b[0]))})();
const TIPOS = [...new Set(SC.map(s=>s.tipo_servico))].concat(P.length?[TIPO_LOJA]:[]);
const MODS = [['compra','Compra direta','Preço definido, compra imediata'],['solicitacao','Solicitação de serviço','Avaliação técnica e orçamento']];

function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max) return max+1;
  let prev = Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i]; let best=i;
    for(let j=1;j<=b.length;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      if(cur[j]<best) best=cur[j];
    }
    if(best>max) return max+1;
    prev=cur;
  }
  return prev[b.length];
}
function variantes(t){
  const v=new Set([t]);
  if(t.length>4){
    if(t.endsWith('oes')||t.endsWith('aes')) v.add(t.slice(0,-3)+'ao');
    if(t.endsWith('eis')) v.add(t.slice(0,-3)+'el');
    if(t.endsWith('ais')) v.add(t.slice(0,-3)+'al');
    if(t.endsWith('es')) v.add(t.slice(0,-2));
    if(t.endsWith('s')) v.add(t.slice(0,-1));
  }
  return [...v];
}
const casa = (arr,v) => v.length<3 ? arr.includes(v) : arr.some(x=>x.startsWith(v));
const conhecido = v => v.length<3 ? VOCAB.has(v) : VOCARR.some(x=>x.startsWith(v));

function analisar(q, semCorrecao){
  const frases=[]; q = q.replace(/["“”']([^"“”']+)["“”']/g,(m,f)=>{frases.push(norm(f).trim());return ' '});
  const brutos = tokens(q);
  const termos=[], corrigidos=[];
  for(const t of brutos){
    if(STOP.has(t) && brutos.length>1) continue;
    let vs = variantes(t);
    if(!semCorrecao && !/^\d+$/.test(t) && !vs.some(conhecido) && t.length>=4){
      const max = t.length>=7?2:1; let best=[],bd=max+1;
      for(const w of VOCARR){ if(w.length<3) continue; const d=lev(t,w,max); if(d<bd){bd=d;best=[w]} else if(d===bd&&best.length<4) best.push(w) }
      if(bd<=max){ corrigidos.push([t,best[0]]); vs = best; }
    }
    termos.push({t,vs});
  }
  return {frases,termos,corrigidos};
}
function pontuar(s,a,modo){
  let score=0, hit=0;
  for(const f of a.frases){ if(!s.fAll.includes(f)) return 0; score += s.fNome.includes(f)?30:12; }
  for(const {t,vs} of a.termos){
    let sc=0;
    if(/^\d+$/.test(t) && String(s.registro)===t) sc=100;
    if(s.sku && norm(s.sku)===t) sc=100;
    for(const v of vs){
      if(casa(s.tNome,v)) sc=Math.max(sc, s.tNome.includes(v)?14:10);
      if(casa(s.tKw,v)) sc=Math.max(sc, 7);
      if(casa(s.tLab,v)) sc=Math.max(sc, 5);
      if(casa(s.tDesc,v)) sc=Math.max(sc, 3);
    }
    if(sc){hit++; score+=sc} else if(modo==='e') return 0;
  }
  if(a.termos.length && !hit) return 0;
  if(s.tNome.length && a.termos.length && a.termos.every(({vs})=>vs.some(v=>casa(s.tNome,v)))) score+=8;
  if(score && s.fonte==='loja') score+=4;  // itens da loja têm ação imediata
  return score;
}
function sinonimos(qn){
  if(qn.length<4) return [];
  return USE.filter(u=> u.n===qn || (qn.length>=5 && u.n.includes(qn)) || (u.n.length>=5 && qn.includes(u.n)) || tokens(u.n).includes(qn))
            .filter(u=> u.nu!==qn).slice(0,3);
}

/* ---------- estado ---------- */
const st = {q:'', labs:new Set(), tipos:new Set(), mods:new Set(), cgcre:false, sort:'rel', shown:24, ou:false};
const CHAVES_URL = ['q','lab','tipo','mod','cgcre','ordem','servico'];
const $ = id => document.getElementById('bi-'+id);
function lerURL(){
  try{
    const p = new URLSearchParams(location.search);
    st.q = p.get('q')||''; st.cgcre = p.get('cgcre')==='1'; st.sort = p.get('ordem')||'rel';
    (p.get('lab')||'').split(',').filter(Boolean).forEach(x=>st.labs.add(x));
    (p.get('tipo')||'').split(',').filter(Boolean).forEach(x=>st.tipos.add(x));
    (p.get('mod')||'').split(',').filter(x=>x==='compra'||x==='solicitacao').forEach(x=>st.mods.add(x));
    return p.get('servico');
  }catch(e){return null}
}
function gravarURL(servico){
  try{
    const p = new URLSearchParams(location.search);
    CHAVES_URL.forEach(k=>p.delete(k));
    if(st.q) p.set('q',st.q);
    if(st.labs.size) p.set('lab',[...st.labs].join(','));
    if(st.tipos.size) p.set('tipo',[...st.tipos].join(','));
    if(st.mods.size) p.set('mod',[...st.mods].join(','));
    if(st.cgcre) p.set('cgcre','1');
    if(st.sort!=='rel') p.set('ordem',st.sort);
    if(servico) p.set('servico',servico);
    const qs = p.toString();
    history.replaceState(history.state,'',location.pathname+(qs?('?'+qs):'')+location.hash);
  }catch(e){}
}

/* ---------- busca ---------- */
let ultimo = {lista:[], termosMarca:[]};
function buscar(){
  const q = st.q.trim();
  const syn = sinonimos(norm(q));
  const a = analisar(q, syn.length>0);
  const vazio = !a.frases.length && !a.termos.length;
  let pontos = new Map(), modo='e', notas=[], extras=[];
  if(semCatalogo) notas.push('O catálogo técnico está temporariamente indisponível. Mostrando apenas os itens da Loja IPT.');
  if(!vazio){
    S.forEach(s=>{const p=pontuar(s,a,'e'); if(p) pontos.set(s,p)});
    syn.forEach(u=>{
      const b = analisar(u.use);
      S.forEach(s=>{const p=pontuar(s,b,'e'); if(p) pontos.set(s, Math.max(pontos.get(s)||0, p*0.8))});
      extras.push(...b.termos);
    });
    if(syn.length) notas.push('Incluindo resultados do termo preferido '+syn.map(u=>'<strong>'+esc(u.use)+'</strong>').join(', ')+' ('+syn.map(u=>esc(caso(u.termo))).join(', ')+' → use '+syn.map(u=>esc(u.use)).join(', ')+').');
    if(!pontos.size && a.termos.length>1){
      modo='ou';
      S.forEach(s=>{const p=pontuar(s,a,'ou'); if(p) pontos.set(s,p)});
      if(pontos.size) notas.push('Nenhum resultado contém todos os termos. Mostrando os que contêm pelo menos um deles.');
    }
    if(a.corrigidos.length) notas.push('Buscando por '+a.corrigidos.map(([o,c])=>'<strong>'+esc(c)+'</strong> em vez de “'+esc(o)+'”').join(', ')+'.');
  }
  const base = vazio ? S.slice() : [...pontos.keys()];
  const passa = (s,ignorar) => (ignorar==='lab'||!st.labs.size||s.laboratorios.some(l=>st.labs.has(l.sigla)))
    && (ignorar==='tipo'||!st.tipos.size||st.tipos.has(s.tipo_servico)) && (ignorar==='cgcre'||!st.cgcre||s.cgcre)
    && (ignorar==='mod'||!st.mods.size||st.mods.has(s.mod));
  const cont = {lab:new Map(), tipo:new Map(), mod:new Map(), cgcre:0};
  base.forEach(s=>{
    if(passa(s,'lab')) s.laboratorios.forEach(l=>cont.lab.set(l.sigla,(cont.lab.get(l.sigla)||0)+1));
    if(passa(s,'tipo')) cont.tipo.set(s.tipo_servico,(cont.tipo.get(s.tipo_servico)||0)+1);
    if(passa(s,'cgcre') && s.cgcre) cont.cgcre++;
    if(passa(s,'mod')) cont.mod.set(s.mod,(cont.mod.get(s.mod)||0)+1);
  });
  let lista = base.filter(s=>passa(s));
  const chave=s=>s.nomeV.replace(/^[^\p{L}]+/u,'');
  const porNome=(x,y)=>chave(x).localeCompare(chave(y),'pt');
  const lojaAntes=(x,y)=>(y.fonte==='loja')-(x.fonte==='loja');
  if(st.sort==='nome') lista.sort(porNome);
  else if(st.sort==='cod') lista.sort((x,y)=>(x.registro??1e9)-(y.registro??1e9)||porNome(x,y));
  else lista.sort(vazio?((x,y)=>lojaAntes(x,y)||porNome(x,y)):((x,y)=>pontos.get(y)-pontos.get(x)||porNome(x,y)));
  const termosMarca = [...new Set([...a.termos.concat(extras).flatMap(x=>x.vs), ...a.frases.flatMap(f=>tokens(f))])].filter(v=>v.length>=2 && !STOP.has(v));
  ultimo = {lista, termosMarca};
  render(lista, cont, notas, vazio, termosMarca);
}

/* ---------- render ---------- */
function cardLoja(s,tm){
  const selo = s.compra ? '<span class="bi-badge bi-compra">Compra direta</span>' : '<span class="bi-badge bi-solic">Solicitação de serviço</span>';
  const onde = s.categorias.length ? `<div class="bi-lab"><span>${marcar(s.categorias.join(' · '),tm)}</span></div>` : '';
  const desc = s.descV ? `<p class="bi-desc">${marcar(s.descV,tm)}</p>` : '';
  const preco = s.compra && s.preco ? `<p class="bi-preco">${esc(s.preco)}</p>` : '';
  const acao = s.compra
    ? (s.carrinho ? `<a class="bi-btn bi-pri" href="${esc(s.carrinho)}">Adicionar ao carrinho</a>` : `<a class="bi-btn bi-pri" href="${esc(s.url)}">Ver opções</a>`)
    : `<a class="bi-btn bi-pri" href="${esc(s.url)}">Solicitar orçamento</a>`;
  return `<article class="bi-card bi-card-loja">
    <div class="bi-meta"><span class="bi-code">Loja IPT</span>${selo}</div>
    <h2>${marcar(s.nomeV,tm)}</h2>
    ${onde}
    ${desc}
    ${preco}
    <div class="bi-actions">
      <a class="bi-btn bi-sec" href="${esc(s.url)}">Ver detalhes</a>
      ${acao}
    </div>
  </article>`;
}
function card(s,tm){
  if(s.fonte==='loja') return cardLoja(s,tm);
  const desc = s.descV ? `<p class="bi-desc">${marcar(s.descV,tm)}</p>` : `<p class="bi-desc bi-none">Descrição não informada no catálogo.</p>`;
  const kws = s.kwV.length ? `<div class="bi-kw">${s.kwV.slice(0,4).map(k=>`<span>${marcar(k,tm)}</span>`).join('')}</div>` : '';
  const labs = s.labsV.map(l=>`<div class="bi-lab"><span class="bi-sigla">${esc(l.sigla)}</span><span>${marcar(l.nome,tm)}</span></div>`).join('');
  return `<article class="bi-card">
    <div class="bi-meta"><span class="bi-code">Nº ${s.registro}</span>
      ${s.cgcre?'<span class="bi-badge" title="Serviço com acreditação Cgcre/Inmetro">Acreditado Cgcre</span>':''}
      ${s.tipo_servico!=='Ensaios, análises e calibrações correntes'?`<span class="bi-badge bi-type">${esc(s.tipo_servico)}</span>`:''}
    </div>
    <h2>${marcar(s.nomeV,tm)}</h2>
    ${labs}
    ${desc}
    ${kws}
    <div class="bi-actions">
      <button class="bi-btn bi-sec" type="button" data-det="${s.registro}">Ver detalhes</button>
      <a class="bi-btn bi-pri" href="${esc(s.contato.url)}" target="_blank" rel="noopener">Solicitar serviço</a>
    </div>
  </article>`;
}
function opcoes(el, itens, sel, cont, nome){
  el.innerHTML = itens.map(([v,rot,sub])=>{
    const n = cont.get(v)||0;
    return `<label class="bi-opt${n||sel.has(v)?'':' bi-zero'}"><input type="checkbox" data-f="${nome}" value="${esc(v)}" ${sel.has(v)?'checked':''}>
      <span class="bi-lbl">${esc(rot)}${sub?`<small>${esc(sub)}</small>`:''}</span><span class="bi-n">${n}</span></label>`;
  }).join('');
}
function render(lista, cont, notas, vazio, tm){
  const n = lista.length;
  const semFiltro = vazio && !st.labs.size && !st.tipos.size && !st.mods.size && !st.cgcre;
  $('count').innerHTML = semFiltro
    ? (P.length && SC.length ? `<strong>${n}</strong> itens: ${SC.length} serviços do catálogo técnico e ${P.length} da Loja IPT`
       : P.length ? `<strong>${n}</strong> itens da Loja IPT` : `<strong>${n}</strong> serviços no catálogo`)
    : `<strong>${n}</strong> ${n===1?'resultado':'resultados'}${st.q.trim()?` para “${esc(st.q.trim())}”`:''}`;
  $('notices').innerHTML = notas.map(t=>`<div class="bi-notice">${t}</div>`).join('');
  $('grid').innerHTML = lista.slice(0,st.shown).map(s=>card(s,tm)).join('');
  $('more').innerHTML = n>st.shown ? `<button class="bi-btn bi-sec" type="button" id="bi-maisbtn">Mostrar mais ${Math.min(24,n-st.shown)} de ${n-st.shown} restantes</button>` : '';
  if(!n){
    $('grid').innerHTML = `<div class="bi-empty" style="grid-column:1/-1"><h2>Nenhum resultado encontrado</h2>
      <p>Tente outra palavra, use o singular ou remova filtros. Alguns laboratórios atendem demandas que não estão neste catálogo.</p>
      <p><a class="bi-btn bi-pri" style="display:inline-flex;padding:0 18px" href="https://ipt.br/contato" target="_blank" rel="noopener">Falar com o IPT</a></p></div>`;
  }
  opcoes($('flab'), LABS.map(([sg,nm])=>[sg,sg,nm]), st.labs, cont.lab, 'lab');
  opcoes($('ftipo'), TIPOS.map(t=>[t,t]), st.tipos, cont.tipo, 'tipo');
  if(P.length) opcoes($('fmod'), MODS, st.mods, cont.mod, 'mod');
  $('fcgcre').checked = st.cgcre; $('ncgcre').textContent = cont.cgcre;
  const nf = st.labs.size+st.tipos.size+st.mods.size+(st.cgcre?1:0);
  $('factive').textContent = nf ? nf+(nf===1?' ativo':' ativos') : '';
  $('freset').style.display = nf ? '' : 'none';
  $('clear').style.display = st.q ? 'block' : 'none';
  $('sort').value = st.sort;
}

/* ---------- detalhes ---------- */
function normas(t){
  const re = /\b(?:ABNT\s+)?(?:NBR(?:\s+(?:ISO|IEC|NM))*(?:\/IEC)?|ISO(?:\/IEC)?|IEC|ASTM|DIN(?:\s+EN)?(?:\s+ISO)?|BS(?:\s+EN)?|EN(?:\s+ISO)?|NM(?:\s+ISO)?|TAPPI|CISPR|ANSI|JIS|AWPA|IESNA\s+LM|UL)\s*[A-Z]?\s?\d[\dA-Z.\-\/]*(?:\s*-\s*\d+)?/g;
  return [...new Set((t||'').match(re)||[])].map(x=>x.replace(/\s+/g,' ').trim());
}
function detalhes(reg){
  const s = S.find(x=>String(x.registro)===String(reg)); if(!s) return;
  const tm = ultimo.termosMarca, nm = normas(s.descricao);
  const certs = s.certificados_cgcre.map(c=>`<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.codigo)} (PDF)</a>`).join(' · ');
  $('dlg').innerHTML = `
    <div class="bi-dlg-head"><div>
      <div class="bi-meta"><span class="bi-code">Nº ${s.registro}</span>${s.cgcre?'<span class="bi-badge">Acreditado Cgcre</span>':''}<span class="bi-badge bi-type">${esc(s.tipo_servico)}</span></div>
      <h2 id="bi-dlg-title">${marcar(s.nomeV,tm)}</h2></div>
      <button class="bi-x" type="button" data-close aria-label="Fechar">✕</button></div>
    <div class="bi-dlg-body"><dl>
      <dt>Descrição</dt><dd>${s.descV?marcar(s.descV,tm):'<span class="bi-hint">Não informada no catálogo.</span>'}</dd>
      ${nm.length?`<dt>Normas citadas</dt><dd><div class="bi-norms">${nm.map(x=>`<span>${esc(x)}</span>`).join('')}</div><div class="bi-hint">Identificadas automaticamente no texto da descrição.</div></dd>`:''}
      <dt>Laboratório${s.labsV.length>1?'s':''}</dt><dd>${s.labsV.map(l=>`<strong>${esc(l.sigla)}</strong> · ${esc(l.nome)}`).join('<br>')}</dd>
      ${s.kwV.length?`<dt>Palavras-chave</dt><dd>${s.kwV.map(k=>marcar(k,tm)).join(' · ')}</dd>`:''}
      ${certs?`<dt>Certificado Cgcre</dt><dd>${certs}</dd>`:''}
      <dt>Código no Scriba</dt><dd>${s.registro}</dd>
    </dl></div>
    <div class="bi-dlg-foot">
      <a class="bi-btn bi-pri" href="${esc(s.contato.url)}" target="_blank" rel="noopener">Solicitar serviço</a>
      <button class="bi-btn bi-sec" type="button" data-copy="${s.registro}">Copiar link deste serviço</button>
    </div>`;
  if(!$('dlg').open) $('dlg').showModal();
  gravarURL(s.registro);
}
