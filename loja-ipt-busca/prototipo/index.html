<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Busca de Serviços IPT</title>
<meta name="description" content="Protótipo de busca do catálogo de ensaios, análises e calibrações do IPT para a Loja IPT.">
<style>
:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#eef2f8; --line:#dde3ee;
  --text:#14213d; --muted:#5a6680; --primary:#002458; --primary-ink:#ffffff;
  --accent:#01adef; --accent-soft:#e3f6fe; --mark:#fff1b8; --ok:#0f7b4f; --ok-soft:#e2f5ec;
  --shadow:0 1px 2px rgba(16,32,64,.06),0 4px 16px rgba(16,32,64,.06);
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --surface:#131c2e; --surface-2:#1a2540; --line:#26324d;
    --text:#e7ecf6; --muted:#9aa7c2; --primary:#5cc8f5; --primary-ink:#06192f;
    --accent:#5cc8f5; --accent-soft:#12324a; --mark:#5a4a0f; --ok:#5fd3a0; --ok-soft:#12352a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#131c2e; --surface-2:#1a2540; --line:#26324d;
  --text:#e7ecf6; --muted:#9aa7c2; --primary:#5cc8f5; --primary-ink:#06192f;
  --accent:#5cc8f5; --accent-soft:#12324a; --mark:#5a4a0f; --ok:#5fd3a0; --ok-soft:#12352a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}

/* topo */
.topbar{background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{font-weight:700;letter-spacing:.2px;color:var(--text);text-decoration:none}
.brand b{color:var(--accent)}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.spacer{flex:1}

/* busca */
.hero{padding:28px 0 18px}
.hero h1{margin:0 0 4px;font-size:clamp(22px,3.2vw,30px);line-height:1.2}
.hero p{margin:0 0 18px;color:var(--muted)}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.searchbox input{width:100%;height:56px;border-radius:var(--radius);border:1.5px solid var(--line);
  background:var(--surface);padding:0 48px 0 48px;font-size:17px;box-shadow:var(--shadow);outline:none}
.searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;
  width:36px;height:36px;border-radius:50%;cursor:pointer;color:var(--muted);display:none}
.clear:hover{background:var(--surface-2)}
.examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center;font-size:13px;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.chip:hover{border-color:var(--accent)}

/* layout */
.layout{display:grid;grid-template-columns:260px 1fr;gap:24px;padding-bottom:48px}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
aside .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 10px;position:sticky;top:12px}
aside details>summary{list-style:none;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;align-items:center}
aside details>summary::-webkit-details-marker{display:none}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 0 8px}
.opt{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-radius:8px;cursor:pointer;font-size:14px}
.opt:hover{background:var(--surface-2)}
.opt input{margin-top:3px;accent-color:var(--accent)}
.opt .n{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.opt .lbl{min-width:0}
.opt .lbl small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.opt.zero{opacity:.45}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:6px 0;font-size:13px}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.count{font-size:14px;color:var(--muted)}
.count strong{color:var(--text)}
.bar select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px}
.notice{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.notice button{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;font-weight:600}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
@media (max-width:400px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-width:0}
.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.code{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface-2);border-radius:6px;padding:5px 7px;color:var(--muted)}
.badge{font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--ok-soft);color:var(--ok)}
.badge.type{background:var(--surface-2);color:var(--muted);font-weight:500}
.card h2{font-size:16.5px;line-height:1.35;margin:0;overflow-wrap:anywhere}
.lab{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.sigla{flex:none;font-weight:700;color:var(--primary);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.desc{margin:0;font-size:14px;color:var(--text);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.desc.none{color:var(--muted);font-style:italic}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kw span{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:2px 8px}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.btn{flex:1;display:inline-flex;justify-content:center;align-items:center;gap:6px;height:40px;border-radius:10px;
  font-weight:600;font-size:14px;text-decoration:none;cursor:pointer;border:1.5px solid transparent;white-space:nowrap}
.btn.sec{background:transparent;border-color:var(--line);color:var(--text)}
.btn.sec:hover{border-color:var(--accent)}
.btn.pri{background:var(--primary);color:var(--primary-ink)}
.btn.pri:hover{filter:brightness(1.12)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.more{display:flex;justify-content:center;margin-top:20px}
.more .btn{flex:none;padding:0 22px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--muted)}
.empty h2{color:var(--text);font-size:18px;margin:0 0 6px}

/* detalhes */
dialog{border:0;padding:0;border-radius:18px;width:min(760px,calc(100vw - 24px));max-height:calc(100dvh - 24px);
  background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,16,32,.55)}
.dlg-head{position:sticky;top:0;background:var(--surface);padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dlg-head h2{margin:6px 0 0;font-size:20px;line-height:1.3}
.x{margin-left:auto;flex:none;border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px}
.dlg-body{padding:16px 20px 8px}
.dlg-body dl{display:grid;grid-template-columns:150px 1fr;gap:10px 16px;margin:0}
@media (max-width:560px){.dlg-body dl{grid-template-columns:1fr;gap:2px}.dlg-body dd{margin-bottom:10px}}
.dlg-body dt{color:var(--muted);font-size:13px}
.dlg-body dd{margin:0;overflow-wrap:anywhere}
.dlg-body dd a{color:var(--accent)}
.dlg-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap}
.dlg-foot .btn{flex:1 1 180px}
.norms{display:flex;flex-wrap:wrap;gap:6px}
.norms span{font:600 12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface-2);border-radius:6px;padding:2px 8px}
.hint{font-size:12px;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:18px 0 28px;color:var(--muted);font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="?">Loja <b>IPT</b></a>
    <span class="tag">Protótipo · busca de serviços</span>
    <span class="spacer"></span>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Ensaios, análises e calibrações</h1>
    <p id="sub">Pesquise no catálogo de serviços dos laboratórios do IPT.</p>
    <form class="searchbox" role="search" onsubmit="return false">
      <label class="sr" for="q">Buscar serviço</label>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" maxlength="200"
        placeholder="Ensaio, material, norma ou laboratório. Ex.: dureza, NBR 7190, etanol">
      <button class="clear" id="clear" type="button" aria-label="Limpar busca">✕</button>
    </form>
    <div class="examples" id="examples"><span>Experimente:</span></div>
  </section>

  <div class="layout">
    <aside>
      <div class="panel">
        <details id="filters" open>
          <summary>Filtros <span class="hint" id="factive"></span></summary>
          <h3>Acreditação</h3>
          <label class="opt"><input type="checkbox" id="fcgcre"><span class="lbl">Somente com certificado Cgcre</span><span class="n" id="ncgcre"></span></label>
          <h3>Tipo de serviço</h3>
          <div id="ftipo"></div>
          <h3>Laboratório</h3>
          <div id="flab"></div>
          <button class="linkbtn" id="freset" type="button">Limpar filtros</button>
        </details>
      </div>
    </aside>

    <section aria-labelledby="count">
      <div class="bar">
        <div class="count" id="count" aria-live="polite"></div>
        <label>
          <span class="sr">Ordenar</span>
          <select id="sort">
            <option value="rel">Mais relevantes</option>
            <option value="nome">Nome (A–Z)</option>
            <option value="cod">Código</option>
          </select>
        </label>
      </div>
      <div id="notices"></div>
      <div class="grid" id="grid"></div>
      <div class="more" id="more"></div>
    </section>
  </div>
</main>

<footer>
  <div class="wrap" id="foot"></div>
</footer>

<dialog id="dlg" aria-labelledby="dlg-title"></dialog>

Núcleo de Tecnologias Avançadas para Bem-Estar e Saúde Aplicados as Ciências da Vida","crd":"DK11"}],"certificados_cgcre":[],"contato":{"url":"https://www.ipt.br/faleconosco/?Manifestacao=2&Ensaio=8802&CRD=DK11","manifestacao":"2"}},{"registro":8803,"tipo_servico":"Serviços tecnológicos","nome":"PARECERES PARA CLASSIFICAÇÃO FISCAL DE MERCADORIAS","descricao":"A CLASSIFICAÇÃO FISCAL DE MERCADORIAS, TAMBÉM CONHECIDA COMO CLASSIFICAÇÃO TARIFÁRIA, VISA DESCREVER E CODIFICAR MERCADORIAS QUANDO AS MESMAS SÃO IMPORTADAS OU NA SAÍDA DO ESTABELECIMENTO INDUSTRIAL. ESSA CLASSIFICAÇÃO É NECESSÁRIA PARA SE DETERMINAR OS TRIBUTOS ENVOLVIDOS NESSAS OPERAÇÕES; IMPOSTO DE IMPORTAÇÃO (II) E IMPOSTO SOBRE PRODUTOS INDUSTRIALIZADOS (IPI), PERMITINDO ASSIM O CONHECIMENTO DAS ALÍQUOTAS DE IMPOSTOS E DE OUTRAS IMPOSIÇÕES A QUE ESTÁ SUJEITA A MERCADORIA. OUTRO IMPOSTO, QUE EM MUITAS SITUAÇÕES, A CARACTERIZAÇÃO DA MERCADORIA SE FAZ NECESSÁRIA PARA A SUA CORRETA TRIBUTAÇÃO, É O IMPOSTO SOBRE CIRCULAÇÃO DE MERCADORIAS E PRESTAÇÕES DE SERVIÇOS (ICMS). A ELABORAÇÃO DE PARECERES TÉCNICOS RELATIVOS À CLASSIFICAÇÃO FISCAL DE PRODUTOS PELO LABORATÓRIO DE ANÁLISES QUÍMICAS SE BASEIA, PRIMORDIALMENTE, NA CAPACIDADE TÉCNICA DO SETOR EM DETERMINAR, ATRAVÉS DE ANÁLISES QUÍMICAS, TESTES FÍSICOS E FÍSICOS- QUÍMICOS, A CORRETA CONSTITUIÇÃO QUÍMICA DA MERCADORIA. ESSE CONHECIMENTO PRECISO E INEQUÍVOCO, QUE PARECERES BASEADOS EM BOLETINS TÉCNICOS OU DE APLICAÇÃO DO PRODUTO NÃO PODEM OFERECER.","palavras_chave":[],"laboratorios":[{"sigla":"NUTABES","nome":"Núcleo de Tecnologias Avançadas para Bem-Estar e Saúde Aplicados as Ciências da Vida","crd":"DK11"}],"certificados_cgcre":[],"contato":{"url":"https://www.ipt.br/faleconosco/?Manifestacao=2&Ensaio=8803&CRD=DK11","manifestacao":"2"}},{"registro":8804,"tipo_servico":"Serviços tecnológicos","nome":"DESENVOLVIMENTO DE MÉTODOS ANALITICOS PARA INDÚSTRIA QUÍMICA, FARMACÊUTICA, VETERINÁRIA E COSMÉTICA.","descricao":"O DESENVOLVIMENTO, ADAPTAÇÃO OU IMPLEMENTAÇÃO DE UM MÉTODO ANALÍTICO ENVOLVE O PROCESSO DE AVALIAÇÃO QUE ESTIME SUA EFICIÊNCIA NA ROTINA DO LABORATÓRIO. DEVE-SE LEVAR EM CONSIDERAÇÃO A ESTRUTURA QUÍMICA, DADOS FÍSICO-QUÍMICOS DA SUBSTÂNCIA QUE SE DESEJA ANALISAR E, O TEOR DE MATÉRIA-PRIMA (IMPUREZAS, PRODUTO ACABADO, DISSOLUÇÃO) E POSSÍVEIS INTERFERENTES. DE FORMA GERAL O DESENVOLVIMENTO DE UM MÉTODO ANALÍTICO ENVOLVE TRÊS ETAPAS PRINCIPAIS: 1) ANALISE DE DOCUMENTOS DE REFERÊNCIA E TESTES PRELIMINARES NO ANALITO QUE SE DESEJA DETERMINAR: O OBJETIVO DESSA ETAPA É MAPEAR O PONTOS FUNDAMENTAIS DO MÉTODO A SER DESENVOLVIDO; 2) TESTES COM VARIÁVEIS CHAVE: NESSA ETAPA O FOCO É TESTAR A SENSIBILIDADE DO MÉTODO DE MANEIRA QUE O MESMO CONTEMPLE A MÁXIMA DETECÇÃO E MENOR INTERFERÊNCIA POSSÍVEL; 3) OTIMIZAÇÃO E RESOLUÇÃO DE PROBLEMAS: NA ÚLTIMA ETAPA AVALIAM-SE OS RESULTADOS OBTIDOS E CASO EXISTAM PARÂMETROS QUE NÃO ATENDAM AOS CRITÉRIOS ESTABELECIDOS AJUSTES SÃO REALIZADOS PARA ADEQUAÇÃO FINAL DO MÉTODO.","palavras_chave":[],"laboratorios":[{"sigla":"NUTABES","nome":"Núcleo de Tecnologias Avançadas para Bem-Estar e Saúde Aplicados as Ciências da Vida","crd":"DK11"}],"certificados_cgcre":[],"contato":{"url":"https://www.ipt.br/faleconosco/?Manifestacao=2&Ensaio=8804&CRD=DK11","manifestacao":"2"}},{"registro":8805,"tipo_servico":"Serviços tecnológicos","nome":"VALIDAÇÃO DE MÉTODOS ANALITICOS","descricao":"A VALIDAÇÃO DEVE SER CONSIDERADA QUANDO SE REALIZAM ADAPTAÇÕES A PARTIR DE METODOLOGIAS EXISTENTES, INCLUSÃO DE NOVAS TÉCNICAS OU USO DE DIFERENTES EQUIPAMENTOS E/OU O DESENVOLVIMENTO DE UM NOVO MÉTODO. SEU OBJETIVO É DEMONSTRAR QUE O MÉTODO ANALÍTICO É ADEQUADO AO USO PROPOSTO. O LAQ REALIZA TRABALHOS DE VALIDAÇÃO DE MÉTODOS ANALÍTICOS PARA COSMÉTICOS, DERMOCOSMÉTICOS, PRODUTOS DE USO VETERINÁRIO E MEDICAMENTOS, ENTRE OUTROS PRODUTOS, EMBASADOS NA RESOLUÇÃO ANVISA – RESOLUÇÃO RE Nº 166: 2017 E DOQ-CGCRE-008, QUE PROPÕE OS SEGUINTES PARÂMETROS. ESPECIFICIDADE LINEARIDADE INTERVALO PRECISÃO LIMITE DE DETECÇÃO (SENSIBILIDADE) const UNID = {KV:'kV',MM:'mm',KG:'kg',CM:'cm',KN:'kN',GHZ:'GHz',HZ:'Hz',KHZ:'kHz',MHZ:'MHz',KPA:'kPa',MPA:'MPa',MG:'mg',MJ:'MJ',ML:'mL',PH:'pH',RPM:'rpm',KW:'kW',KWH:'kWh',MW:'MW',VA:'VA',KVA:'kVA',LUX:'lux'};
const PROPRIOS = new Set('janka rockwell brinell vickers shore breuning karl fischer cobb bekk klemm taber jokro pitot coriolis kjeldahl charpy izod los angeles abrams mullen schopper elmendorf gurley sheffield bendtsen martindale wyzenbeek venturi pfi'.split(' '));
function caso(s, titulo){
  if(!s) return '';
  let out = s.toLowerCase().replace(/[\p{L}\p{N}][\p{L}\p{N}\/\-]*/gu, w=>{
    const up = w.toUpperCase();
    if(SIGLAS.has(up) || /^[A-Z]+\d/i.test(up) && up.length<=12 && /\d/.test(up) && /[A-Z]/i.test(up) && !/^\d/.test(up)) return up;
    if(UNID[up]) return UNID[up];
    if(up.includes('/') && up.split('/').every(p=>SIGLAS.has(p))) return up;
    if(PROPRIOS.has(w) || (titulo && !STOP.has(w))) return w.charAt(0).toUpperCase()+w.slice(1);
    return w;
  });
  out = out.replace(/°c\b/g,'°C').replace(/°f\b/g,'°F').replace(/(\d)\s?ºc\b/g,'$1 ºC');
  if(!titulo) out = out.replace(/(^|[.!?:]\s+)(\p{Ll})/gu,(m,a,b)=>a+b.toUpperCase());
  return out;
}
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function marcar(texto, termos){
  const t = esc(texto);
  if(!termos.length) return t;
  return t.replace(/[\p{L}\p{N}]+/gu, w=>{
    const n = norm(w);
    return termos.some(v=> v.length>=2 && n.startsWith(v)) ? '<mark>'+w+'</mark>' : w;
  });
}

function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max) return max+1;
  let prev = Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i]; let best=i;
    for(let j=1;j<=b.length;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      if(cur[j]<best) best=cur[j];
    }
    if(best>max) return max+1;
    prev=cur;
  }
  return prev[b.length];
}
function variantes(t){
  const v=new Set([t]);
  if(t.length>4){
    if(t.endsWith('oes')||t.endsWith('aes')) v.add(t.slice(0,-3)+'ao');
    if(t.endsWith('eis')) v.add(t.slice(0,-3)+'el');
    if(t.endsWith('ais')) v.add(t.slice(0,-3)+'al');
    if(t.endsWith('es')) v.add(t.slice(0,-2));
    if(t.endsWith('s')) v.add(t.slice(0,-1));
  }
  return [...v];
}
const casa = (arr,v) => v.length<3 ? arr.includes(v) : arr.some(x=>x.startsWith(v));
const conhecido = v => v.length<3 ? VOCAB.has(v) : VOCARR.some(x=>x.startsWith(v));

function analisar(q, semCorrecao){
  const frases=[]; q = q.replace(/["“”']([^"“”']+)["“”']/g,(m,f)=>{frases.push(norm(f).trim());return ' '});
  const brutos = tokens(q);
  const termos=[], corrigidos=[];
  for(const t of brutos){
    if(STOP.has(t) && brutos.length>1) continue;
    let vs = variantes(t);
    if(!semCorrecao && !/^\d+$/.test(t) && !vs.some(conhecido) && t.length>=4){
      const max = t.length>=7?2:1; let best=[],bd=max+1;
      for(const w of VOCARR){ if(w.length<3) continue; const d=lev(t,w,max); if(d<bd){bd=d;best=[w]} else if(d===bd&&best.length<4) best.push(w) }
      if(bd<=max){ corrigidos.push([t,best[0]]); vs = best; }
    }
    termos.push({t,vs});
  }
  return {frases,termos,corrigidos};
}
function pontuar(s,a,modo){
  let score=0, hit=0;
  for(const f of a.frases){ if(!s.fAll.includes(f)) return 0; score += s.fNome.includes(f)?30:12; }
  for(const {t,vs} of a.termos){
    let sc=0;
    if(/^\d+$/.test(t) && String(s.registro)===t) sc=100;
    for(const v of vs){
      if(casa(s.tNome,v)) sc=Math.max(sc, s.tNome.includes(v)?14:10);
      if(casa(s.tKw,v)) sc=Math.max(sc, 7);
      if(casa(s.tLab,v)) sc=Math.max(sc, 5);
      if(casa(s.tDesc,v)) sc=Math.max(sc, 3);
    }
    if(sc){hit++; score+=sc} else if(modo==='e') return 0;
  }
  if(a.termos.length && !hit) return 0;
  if(s.tNome.length && a.termos.length && a.termos.every(({vs})=>vs.some(v=>casa(s.tNome,v)))) score+=8;
  return score;
}
function sinonimos(qn){
  if(qn.length<4) return [];
  return USE.filter(u=> u.n===qn || (qn.length>=5 && u.n.includes(qn)) || (u.n.length>=5 && qn.includes(u.n)) || tokens(u.n).includes(qn))
            .filter(u=> u.nu!==qn).slice(0,3);
}

    (p.get('lab')||'').split(',').filter(Boolean).forEach(x=>st.labs.add(x));
    (p.get('tipo')||'').split(',').filter(Boolean).forEach(x=>st.tipos.add(x));
    return p.get('servico');
  }catch(e){return null}
}
function gravarURL(servico){
  try{
    const p = new URLSearchParams();
    if(st.q) p.set('q',st.q);
    if(st.labs.size) p.set('lab',[...st.labs].join(','));
    if(st.tipos.size) p.set('tipo',[...st.tipos].join(','));
    if(st.cgcre) p.set('cgcre','1');
    if(st.sort!=='rel') p.set('ordem',st.sort);
    if(servico) p.set('servico',servico);
    const qs = p.toString();
    history.replaceState(null,'',qs?('?'+qs):location.pathname);
  }catch(e){}
}

/* ---------- busca ---------- */
let ultimo = {lista:[], termosMarca:[]};
function buscar(){
  const q = st.q.trim();
  const syn = sinonimos(norm(q));
  const a = analisar(q, syn.length>0);
  const vazio = !a.frases.length && !a.termos.length;
  let pontos = new Map(), modo='e', notas=[], extras=[];
  if(!vazio){
    S.forEach(s=>{const p=pontuar(s,a,'e'); if(p) pontos.set(s,p)});
    syn.forEach(u=>{
      const b = analisar(u.use);
      S.forEach(s=>{const p=pontuar(s,b,'e'); if(p) pontos.set(s, Math.max(pontos.get(s)||0, p*0.8))});
      extras.push(...b.termos);
    });
    if(syn.length) notas.push('Incluindo resultados do termo preferido '+syn.map(u=>'<strong>'+esc(u.use)+'</strong>').join(', ')+' ('+syn.map(u=>esc(caso(u.termo))).join(', ')+' → use '+syn.map(u=>esc(u.use)).join(', ')+').');
    if(!pontos.size && a.termos.length>1){
      modo='ou';
      S.forEach(s=>{const p=pontuar(s,a,'ou'); if(p) pontos.set(s,p)});
      if(pontos.size) notas.push('Nenhum serviço contém todos os termos. Mostrando os que contêm pelo menos um deles.');
    }
    if(a.corrigidos.length) notas.push('Buscando por '+a.corrigidos.map(([o,c])=>'<strong>'+esc(c)+'</strong> em vez de “'+esc(o)+'”').join(', ')+'.');
  }
  const base = vazio ? S.slice() : [...pontos.keys()];
  const passa = (s,ignorar) => (ignorar==='lab'||!st.labs.size||s.laboratorios.some(l=>st.labs.has(l.sigla)))
    && (ignorar==='tipo'||!st.tipos.size||st.tipos.has(s.tipo_servico)) && (ignorar==='cgcre'||!st.cgcre||s.cgcre);
  const cont = {lab:new Map(), tipo:new Map(), cgcre:0};
  base.forEach(s=>{
    if(passa(s,'lab')) s.laboratorios.forEach(l=>cont.lab.set(l.sigla,(cont.lab.get(l.sigla)||0)+1));
    if(passa(s,'tipo')) cont.tipo.set(s.tipo_servico,(cont.tipo.get(s.tipo_servico)||0)+1);
    if(passa(s,'cgcre') && s.cgcre) cont.cgcre++;
  });
  let lista = base.filter(s=>passa(s));
  const chave=s=>s.nomeV.replace(/^[^\p{L}]+/u,'');
  const porNome=(x,y)=>chave(x).localeCompare(chave(y),'pt');
  if(st.sort==='nome') lista.sort(porNome);
  else if(st.sort==='cod') lista.sort((x,y)=>x.registro-y.registro);
  else lista.sort(vazio?porNome:((x,y)=>pontos.get(y)-pontos.get(x)||porNome(x,y)));
  const termosMarca = [...new Set([...a.termos.concat(extras).flatMap(x=>x.vs), ...a.frases.flatMap(f=>tokens(f))])].filter(v=>v.length>=2 && !STOP.has(v));
  ultimo = {lista, termosMarca};
  render(lista, cont, notas, vazio, termosMarca);
}

/* ---------- render ---------- */
function card(s,tm){
  const desc = s.descV ? `<p class="desc">${marcar(s.descV,tm)}</p>` : `<p class="desc none">Descrição não informada no catálogo.</p>`;
  const kws = s.kwV.length ? `<div class="kw">${s.kwV.slice(0,4).map(k=>`<span>${marcar(k,tm)}</span>`).join('')}</div>` : '';
  const labs = s.labsV.map(l=>`<div class="lab"><span class="sigla">${esc(l.sigla)}</span><span>${marcar(l.nome,tm)}</span></div>`).join('');
  return `<article class="card">
    <div class="meta"><span class="code">Nº ${s.registro}</span>
      ${s.cgcre?'<span class="badge" title="Serviço com acreditação Cgcre/Inmetro">Acreditado Cgcre</span>':''}
      ${s.tipo_servico!=='Ensaios, análises e calibrações correntes'?`<span class="badge type">${esc(s.tipo_servico)}</span>`:''}
    </div>
    <h2>${marcar(s.nomeV,tm)}</h2>
    ${labs}
    ${desc}
    ${kws}
    <div class="actions">
      <button class="btn sec" type="button" data-det="${s.registro}">Ver detalhes</button>
      <a class="btn pri" href="${esc(s.contato.url)}" target="_blank" rel="noopener">Solicitar serviço</a>
    </div>
  </article>`;
}
function opcoes(el, itens, sel, cont, nome){
  el.innerHTML = itens.map(([v,rot,sub])=>{
    const n = cont.get(v)||0;
    return `<label class="opt${n||sel.has(v)?'':' zero'}"><input type="checkbox" data-f="${nome}" value="${esc(v)}" ${sel.has(v)?'checked':''}>
      <span class="lbl">${esc(rot)}${sub?`<small>${esc(sub)}</small>`:''}</span><span class="n">${n}</span></label>`;
  }).join('');
}
function render(lista, cont, notas, vazio, tm){
  const n = lista.length;
  $('count').innerHTML = vazio && !st.labs.size && !st.tipos.size && !st.cgcre
    ? `<strong>${n}</strong> serviços no catálogo`
    : `<strong>${n}</strong> ${n===1?'serviço encontrado':'serviços encontrados'}${st.q.trim()?` para “${esc(st.q.trim())}”`:''}`;
  $('notices').innerHTML = notas.map(t=>`<div class="notice">${t}</div>`).join('');
  $('grid').innerHTML = lista.slice(0,st.shown).map(s=>card(s,tm)).join('');
  $('more').innerHTML = n>st.shown ? `<button class="btn sec" type="button" id="maisbtn">Mostrar mais ${Math.min(24,n-st.shown)} de ${n-st.shown} restantes</button>` : '';
  if(!n){
    $('grid').innerHTML = `<div class="empty" style="grid-column:1/-1"><h2>Nenhum serviço encontrado</h2>
      <p>Tente outra palavra, use o singular ou remova filtros. Alguns laboratórios atendem demandas que não estão neste catálogo.</p>
      <p><a class="btn pri" style="display:inline-flex;padding:0 18px" href="https://ipt.br/contato" target="_blank" rel="noopener">Falar com o IPT</a></p></div>`;
  }
  opcoes($('flab'), LABS.map(([sg,nm])=>[sg,sg,nm]), st.labs, cont.lab, 'lab');
  opcoes($('ftipo'), TIPOS.map(t=>[t,t]), st.tipos, cont.tipo, 'tipo');
  $('fcgcre').checked = st.cgcre; $('ncgcre').textContent = cont.cgcre;
  const nf = st.labs.size+st.tipos.size+(st.cgcre?1:0);
  $('factive').textContent = nf ? nf+(nf===1?' ativo':' ativos') : '';
  $('freset').style.display = nf ? '' : 'none';
  $('clear').style.display = st.q ? 'block' : 'none';
  $('sort').value = st.sort;
}

/* ---------- detalhes ---------- */
function normas(t){
  const re = /\b(?:ABNT\s+)?(?:NBR(?:\s+(?:ISO|IEC|NM))*(?:\/IEC)?|ISO(?:\/IEC)?|IEC|ASTM|DIN(?:\s+EN)?(?:\s+ISO)?|BS(?:\s+EN)?|EN(?:\s+ISO)?|NM(?:\s+ISO)?|TAPPI|CISPR|ANSI|JIS|AWPA|IESNA\s+LM|UL)\s*[A-Z]?\s?\d[\dA-Z.\-\/]*(?:\s*-\s*\d+)?/g;
  return [...new Set((t||'').match(re)||[])].map(x=>x.replace(/\s+/g,' ').trim());
}
function detalhes(reg){
  const s = S.find(x=>String(x.registro)===String(reg)); if(!s) return;
  const tm = ultimo.termosMarca, nm = normas(s.descricao);
  const certs = s.certificados_cgcre.map(c=>`<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.codigo)} (PDF)</a>`).join(' · ');
  $('dlg').innerHTML = `
    <div class="dlg-head"><div>
      <div class="meta"><span class="code">Nº ${s.registro}</span>${s.cgcre?'<span class="badge">Acreditado Cgcre</span>':''}<span class="badge type">${esc(s.tipo_servico)}</span></div>
      <h2 id="dlg-title">${marcar(s.nomeV,tm)}</h2></div>
      <button class="x" type="button" data-close aria-label="Fechar">✕</button></div>
    <div class="dlg-body"><dl>
      <dt>Descrição</dt><dd>${s.descV?marcar(s.descV,tm):'<span class="hint">Não informada no catálogo.</span>'}</dd>
      ${nm.length?`<dt>Normas citadas</dt><dd><div class="norms">${nm.map(x=>`<span>${esc(x)}</span>`).join('')}</div><div class="hint">Identificadas automaticamente no texto da descrição.</div></dd>`:''}
      <dt>Laboratório${s.labsV.length>1?'s':''}</dt><dd>${s.labsV.map(l=>`<strong>${esc(l.sigla)}</strong> · ${esc(l.nome)}`).join('<br>')}</dd>
      ${s.kwV.length?`<dt>Palavras-chave</dt><dd>${s.kwV.map(k=>marcar(k,tm)).join(' · ')}</dd>`:''}
      ${certs?`<dt>Certificado Cgcre</dt><dd>${certs}</dd>`:''}
      <dt>Código no Scriba</dt><dd>${s.registro}</dd>
    </dl></div>
    <div class="dlg-foot">
      <a class="btn pri" href="${esc(s.contato.url)}" target="_blank" rel="noopener">Solicitar serviço</a>
      <button class="btn sec" type="button" data-copy="${s.registro}">Copiar link deste serviço</button>
    </div>`;
  if(!$('dlg').open) $('dlg').showModal();
  gravarURL(s.registro);
}

/* ---------- eventos ---------- */
let tmr;
$('q').addEventListener('input', e=>{ st.q=e.target.value; st.shown=24; clearTimeout(tmr); tmr=setTimeout(()=>{buscar();gravarURL()},140); });
$('clear').addEventListener('click', ()=>{ st.q=''; $('q').value=''; st.shown=24; buscar(); gravarURL(); $('q').focus(); });
$('sort').addEventListener('change', e=>{ st.sort=e.target.value; buscar(); gravarURL(); });
$('fcgcre').addEventListener('change', e=>{ st.cgcre=e.target.checked; st.shown=24; buscar(); gravarURL(); });
$('freset').addEventListener('click', ()=>{ st.labs.clear(); st.tipos.clear(); st.cgcre=false; st.shown=24; buscar(); gravarURL(); });
document.addEventListener('change', e=>{
  const f=e.target.dataset.f; if(!f) return;
  const set = f==='lab'?st.labs:st.tipos;
  e.target.checked?set.add(e.target.value):set.delete(e.target.value);
  st.shown=24; buscar(); gravarURL();
});
document.addEventListener('click', e=>{
  const d=e.target.closest('[data-det]'); if(d){detalhes(d.dataset.det);return}
  if(e.target.closest('[data-close]')){$('dlg').close();return}
  const c=e.target.closest('[data-copy]');
  if(c){
    let url=location.href; try{const u=new URL(location.href);u.search='';u.searchParams.set('servico',c.dataset.copy);url=u.href}catch(_){}
    const ok=()=>{c.textContent='Link copiado'};
    try{navigator.clipboard.writeText(url).then(ok,()=>{c.textContent=url})}catch(_){c.textContent=url}
    return;
  }
  if(e.target.id==='maisbtn'){ st.shown+=24; buscar(); }
  const ch=e.target.closest('[data-ex]'); if(ch){ st.q=ch.dataset.ex; $('q').value=st.q; st.shown=24; buscar(); gravarURL(); }
});
$('dlg').addEventListener('click', e=>{ if(e.target===$('dlg')) $('dlg').close(); });
$('dlg').addEventListener('close', ()=>gravarURL());
if(matchMedia('(max-width:860px)').matches) $('filters').open=false;

/* ---------- início ---------- */
['dureza','calibração de multímetro','NBR 7190','etanol','resistência ao fogo','papel'].forEach(x=>{
  const b=document.createElement('button'); b.type='button'; b.className='chip'; b.dataset.ex=x; b.textContent=x; $('examples').appendChild(b);
});
const m = DADOS.meta;
$('sub').textContent = `Pesquise entre ${m.servicos_unicos} serviços de ${m.laboratorios} laboratórios do IPT.`;
$('foot').innerHTML = `Protótipo. Dados do catálogo público do Scriba (Busca_EAC), coletados em ${m.coletado_em.split('-').reverse().join('/')}. Textos convertidos da caixa alta para leitura; o conteúdo é o original.`;
const servicoURL = lerURL();
$('q').value = st.q;
buscar();
if(servicoURL) detalhes(servicoURL);
</script>
</body>
